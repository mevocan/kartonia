<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Telefonda ana ekrana eklenince tam ekran ve yatay açılır (ui/mobil.ts tarayıcıda da tam ekran + yatay kilit dener). -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kartonia — kağıttan kasaba kurma oyunu</title>
  <meta name="description" content="Kartonia: tarayıcıda oynanan, kağıttan maket görünümlü, sakin bir 3D kasaba kurma oyunu. Yol çiz, evler kur, sakinlerini mutlu et. Ücretsiz, kurulum yok." />
  <meta name="theme-color" content="#e9dcc3" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Kartonia" />
  <meta property="og:description" content="Kağıttan maket görünümlü, sakin bir 3D kasaba kurma oyunu. Tarayıcında hemen oyna." />
  <meta property="og:locale" content="tr_TR" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbf3e2'/%3E%3Cpath d='M12 30 32 13l20 17z' fill='%23c9544a' stroke='%234a3b2e' stroke-width='2.5' stroke-linejoin='round'/%3E%3Crect x='17' y='30' width='30' height='22' fill='%23f1e4c8' stroke='%234a3b2e' stroke-width='2.5'/%3E%3Crect x='28' y='38' width='8' height='14' fill='%23d9a13b' stroke='%234a3b2e' stroke-width='2'/%3E%3C/svg%3E" />
  <!-- Yazı tipi: Patrick Hand (elle yazılmış görünüm, Türkçe harfler dahil). Yüklenemezse sistem el yazısı fontuna düşer. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" />
  <style>
    /* Yalnızca JS gelmeden görünenler. Arayüzün tasarım sistemi: src/ui/stil.css */
    :root {
      --yuzey-dolu: #fffbf3; --kagit-zemin: #f5ebd3; --metin: #514a3f; --metin-soluk: #8c8273;
      --toprak: #c97858; --altin: #d9a13b;
      --golge-buyuk: 0 2px 4px rgba(70, 50, 30, 0.1), 0 14px 32px rgba(70, 50, 30, 0.2);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #e9dcc3; color: var(--metin);
      font-family: "Patrick Hand", "Segoe Print", "Comic Sans MS", system-ui, sans-serif; font-size: 15px;
      user-select: none; -webkit-user-select: none;
    }
    #sahne { position: fixed; inset: 0; }
    #sahne canvas { display: block; width: 100%; height: 100%; }
    #arayuz { position: fixed; inset: 0; pointer-events: none; }
    #arayuz > * { pointer-events: auto; }

    /* ---- Yükleme ekranı ---- */
    #yukleme {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #f6ecd6 0%, #e9dcc3 60%, #dccaa8 100%);
      transition: opacity 0.5s;
    }
    #yukleme.bitti { opacity: 0; pointer-events: none; }
    .yukleme-kart {
      width: 270px; padding: 28px 24px 22px; text-align: center; border-radius: 20px;
      background: var(--yuzey-dolu); box-shadow: var(--golge-buyuk);
    }
    .yukleme-kart h1 { margin: 12px 0 4px; font-family: "Patrick Hand", "Segoe Print", sans-serif; font-weight: 400; font-size: 32px; }
    .yukleme-kart p { margin: 0 0 16px; color: var(--metin-soluk); font-size: 13px; font-weight: 700; }
    .yukleme-ev { width: 54px; height: 46px; margin: 0 auto; position: relative; animation: evSalla 1.4s ease-in-out infinite; }
    .yukleme-ev::before { /* çatı */
      content: ""; position: absolute; left: 0; top: 0; width: 0; height: 0;
      border-left: 27px solid transparent; border-right: 27px solid transparent; border-bottom: 20px solid var(--toprak);
    }
    .yukleme-ev span { position: absolute; left: 7px; top: 20px; width: 40px; height: 26px; background: var(--kagit-zemin); border-radius: 0 0 4px 4px; }
    .yukleme-ev span::after { content: ""; position: absolute; left: 15px; bottom: 0; width: 10px; height: 13px; background: var(--altin); border-radius: 3px 3px 0 0; }
    @keyframes evSalla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .yukleme-cubuk { height: 5px; border-radius: 3px; background: var(--kagit-zemin); overflow: hidden; }
    .yukleme-cubuk > div { width: 40%; height: 100%; background: var(--altin); border-radius: 3px; animation: yuklemeKay 1.2s ease-in-out infinite; }
    @keyframes yuklemeKay { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #jsYok { position: fixed; z-index: 60; top: 50%; left: 50%; width: 300px; margin: -40px 0 0 -150px; padding: 20px; text-align: center; background: var(--yuzey-dolu); border-radius: 14px; }
    @media (prefers-reduced-motion: reduce) {
      .yukleme-ev, .yukleme-cubuk > div { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="sahne"></div>
  <div id="arayuz"></div>
  <!-- Yükleme ekranı: JS gelene kadar görünür, main.ts menü hazır olunca kaldırır. -->
  <div id="yukleme">
    <div class="yukleme-kart">
      <div class="yukleme-ev"><span></span></div>
      <h1>Kartonia</h1>
      <p>Kağıtlar katlanıyor…</p>
      <div class="yukleme-cubuk"><div></div></div>
    </div>
  </div>
  <script>
    // Dil (ui/i18n.ts ile aynı kural): kayıtlı seçim, yoksa tarayıcı dili. JS yüklenmeden yükleme ekranı doğru dilde görünsün.
    (function () {
      var d = null;
      try { d = localStorage.getItem('kagit-kasaba-dil'); } catch (e) { /* yok say */ }
      if (d !== 'tr' && d !== 'en') d = (navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
      document.documentElement.lang = d;
      if (d === 'en') {
        document.title = 'Kartonia — build a little paper town';
        document.querySelector('.yukleme-kart p').textContent = 'Folding the paper…';
      }
    })();
  </script>
  <noscript>
    <div id="jsYok" class="kagit">Kartonia'yı oynamak için tarayıcında JavaScript'i açman gerekiyor.</div>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
