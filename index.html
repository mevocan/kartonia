<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kağıt Kasaba</title>
  <style>
    :root {
      --kagit: #fbf3e2;
      --kagit-koyu: #f1e4c8;
      --murekkep: #4a3b2e;
      --soluk: #9a8a78;
      --kirmizi: #c9544a;
      --yesil: #5f9a5a;
      --altin: #d9a13b;
      --bant: rgba(236, 214, 150, 0.75);
      --golge: 0 3px 8px rgba(80, 55, 30, 0.22), 0 1px 2px rgba(80, 55, 30, 0.18);
      --golge-buyuk: 0 10px 24px rgba(80, 55, 30, 0.28), 0 2px 4px rgba(80, 55, 30, 0.2);
      --font: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #e9dcc3; color: var(--murekkep);
      font-family: var(--font); font-size: 14px;
      user-select: none; -webkit-user-select: none;
    }
    #sahne { position: fixed; inset: 0; }
    #sahne canvas { display: block; width: 100%; height: 100%; }
    #arayuz { position: fixed; inset: 0; pointer-events: none; }
    #arayuz > * { pointer-events: auto; }
    button { font-family: inherit; color: inherit; cursor: pointer; }

    /* Ortak kağıt kart */
    .kagit {
      background: var(--kagit);
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.5) 0, transparent 60%),
        repeating-linear-gradient(0deg, rgba(120,90,50,0.025) 0 2px, transparent 2px 5px);
      border-radius: 4px;
      box-shadow: var(--golge);
      position: relative;
    }
    .bant::before {
      content: ""; position: absolute; top: -9px; left: 50%;
      width: 64px; height: 18px; margin-left: -32px;
      background: var(--bant); transform: rotate(-3deg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .raptiye::after {
      content: ""; position: absolute; top: 6px; left: 50%;
      width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff9d8f, #c9544a 60%, #8e2f28);
      box-shadow: 1px 2px 2px rgba(0,0,0,0.3);
    }

    /* Üst şerit (HUD) */
    #hud {
      /* Hedef kartının (sol üst, ~230 px) sağından başlar: şerit genişledikçe kartın altına girmesin. */
      position: absolute; top: 10px; left: 238px; transform: rotate(-0.4deg);
      display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px;
      flex-wrap: wrap; row-gap: 4px; max-width: calc(100vw - 238px - 110px);
      white-space: nowrap;
    }
    .hud-oge { display: flex; flex-direction: column; align-items: center; min-width: 46px; transition: transform 0.15s; }
    /* Dar pencere: mal adları gizlenir (simge kalır), öğeler daralır; yine sığmazsa şerit iki satıra kayar. */
    @media (max-width: 1500px) {
      #hud .etiket .ad { display: none; }
      #hud .hud-oge { min-width: 34px; }
      #hud .hud-oge.mevsim { min-width: 62px; }
    }
    .hud-oge .etiket { font-size: 11px; color: var(--soluk); }
    .hud-oge .deger { font-size: 17px; font-weight: bold; }
    .hud-oge.vurgu { animation: vurgu 0.6s ease-out; }
    .hud-oge.vurgu-eksi .deger { color: var(--kirmizi); }
    .hud-oge.vurgu-arti .deger { color: var(--yesil); }
    @keyframes vurgu { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
    /* Mevsim: simge + ad, altında "kışa X gün" */
    .hud-oge.mevsim { min-width: 70px; }
    .hud-oge.mevsim .deger { font-size: 14px; }
    .hud-oge.mevsim.yakin .etiket:last-child { color: var(--kirmizi); font-weight: bold; }
    .hud-oge.mevsim.kis .etiket:last-child { color: #5b86a8; font-weight: bold; }
    /* Para'nın üstüne gelince açılan dünkü gelir-gider dökümü */
    .hud-oge.para { position: relative; cursor: default; }
    #paraDokum {
      position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%) rotate(1deg);
      width: 180px; padding: 10px 12px 8px; font-size: 12px; display: none; z-index: 5;
      pointer-events: none !important; white-space: normal;
    }
    .hud-oge.para:hover #paraDokum { display: block; }
    #paraDokum h4 { margin: 0 0 6px; font-size: 12px; color: var(--soluk); font-weight: normal; }
    #paraDokum table { width: 100%; border-collapse: collapse; }
    #paraDokum td:last-child { text-align: right; font-weight: bold; }
    #paraDokum tr.net td { border-top: 1px dashed var(--soluk); padding-top: 3px; }
    #paraDokum .arti { color: var(--yesil); }
    #paraDokum .eksi { color: var(--kirmizi); }
    .ayrac { width: 1px; align-self: stretch; background: repeating-linear-gradient(180deg, var(--soluk) 0 3px, transparent 3px 6px); opacity: 0.5; }
    .gun-cubuk { width: 70px; height: 6px; border-radius: 3px; background: var(--kagit-koyu); overflow: hidden; margin-top: 3px; }
    .gun-cubuk > div { height: 100%; background: var(--altin); width: 0; }
    .mutluluk-cubuk { width: 52px; height: 5px; border-radius: 3px; background: var(--kagit-koyu); overflow: hidden; margin-top: 2px; }
    .mutluluk-cubuk > div { height: 100%; width: 50%; transition: width 0.4s, background 0.4s; }
    .hizlar { display: flex; gap: 4px; }
    .hizlar button {
      border: 1.5px solid var(--murekkep); background: var(--kagit); border-radius: 4px;
      padding: 2px 7px; font-size: 13px; transition: transform 0.1s;
    }
    .hizlar button.secili { background: var(--altin); color: #fff; transform: rotate(-3deg) translateY(-1px); }

    /* Hedef kartı */
    #hedef { position: absolute; top: 14px; left: 14px; width: 210px; padding: 22px 14px 12px; transform: rotate(-2deg); }
    #hedef h3 { margin: 0 0 4px; font-size: 15px; }
    #hedef p { margin: 0 0 6px; font-size: 12px; color: var(--soluk); }
    #hedef .ilerleme { font-size: 12px; }
    /* Sakin isteği: hedef kartının altında küçük kart */
    #istek { position: absolute; top: 132px; left: 18px; width: 196px; padding: 10px 12px; transform: rotate(1deg); display: none; font-size: 12px; }
    #istek h4 { margin: 0 0 3px; font-size: 13px; }
    #istek p { margin: 0 0 5px; color: var(--soluk); }
    #istek .dugme { margin-top: 6px; width: 100%; font-size: 12px; }

    /* Yeni oyun */
    #yeniOyun {
      position: absolute; top: 14px; right: 14px; padding: 6px 10px; font-size: 12px;
      border: none; transform: rotate(2deg);
    }

    /* Bildirimler */
    #bildirimler {
      position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none !important;
    }
    .bildirim {
      padding: 8px 18px; font-size: 14px; max-width: 420px; text-align: center;
      animation: bildirimGir 0.3s ease-out; transition: opacity 0.4s, transform 0.4s;
    }
    .bildirim:nth-child(odd) { transform: rotate(-1deg); }
    .bildirim:nth-child(even) { transform: rotate(1deg); }
    .bildirim.iyi { border-left: 5px solid var(--yesil); }
    .bildirim.kotu { border-left: 5px solid var(--kirmizi); }
    .bildirim.bilgi { border-left: 5px solid var(--altin); }
    .bildirim.gidiyor { opacity: 0; transform: translateY(-10px); }
    @keyframes bildirimGir { from { opacity: 0; transform: translateY(-12px) scale(0.95); } }

    /* Bina menüsü */
    #menu {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 10px 10px;
    }
    #menu .satir { display: flex; gap: 8px; align-items: flex-end; }
    /* Her kategorinin rengi --kat ile gelir: kategori düğmesinin zemini, açılan şeridin ve kartların üst bandı. */
    #menu > #altMenu { display: none; padding: 10px 12px 4px; border-top: 6px solid var(--kat); }
    #menu > #altMenu.acik { display: flex; animation: altMenuGir 0.16s ease-out; }
    @keyframes altMenuGir { from { opacity: 0; transform: translateY(10px); } }
    .kagit.kategori {
      width: 96px; height: 52px; border: none; padding: 7px 6px 6px; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      transition: transform 0.15s ease-out, box-shadow 0.15s;
      background-color: var(--kat); border-bottom: 3px solid rgba(74,59,46,0.18);
    }
    .kategori .ad { color: var(--murekkep, #3f302a); }
    .kategori .sayi { color: rgba(63,48,42,0.7) !important; }
    .kategori:nth-child(odd) { transform: rotate(-1deg); }
    .kategori:nth-child(even) { transform: rotate(1deg); }
    .kategori:hover { transform: translateY(-4px) rotate(0deg); box-shadow: var(--golge-buyuk); }
    .kategori.acik { transform: translateY(-8px) rotate(0deg); box-shadow: var(--golge-buyuk); outline: 2px dashed var(--altin); outline-offset: -5px; }
    .kategori .ad { font-size: 13px; font-weight: bold; }
    .kategori .sayi { font-size: 10px; color: var(--soluk); }
    .kategori .yeni { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--altin); border: 2px solid var(--kagit); display: none; }
    .kategori.yeni-var .yeni { display: block; }
    .menu-ayrac { width: 2px; height: 60px; margin: 0 2px 8px; align-self: flex-end; background: repeating-linear-gradient(180deg, var(--soluk) 0 4px, transparent 4px 8px); opacity: 0.5; }
    .bina-kart {
      width: 84px; height: 104px; border: none; border-top: 5px solid var(--kat); padding: 4px 4px 6px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      transition: transform 0.15s ease-out, box-shadow 0.15s;
    }
    .bina-kart:nth-child(odd) { transform: rotate(-1.5deg); }
    .bina-kart:nth-child(even) { transform: rotate(1.2deg); }
    .bina-kart:hover { transform: translateY(-6px) rotate(0deg); box-shadow: var(--golge-buyuk); }
    .bina-kart.secili { transform: translateY(-18px) rotate(-2deg) scale(1.05); box-shadow: var(--golge-buyuk); outline: 2px dashed var(--altin); outline-offset: -5px; }
    .bina-kart .resim { width: 64px; height: 54px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 2px 1px rgba(74,59,46,0.25)); }
    .bina-kart .resim.bos { width: 30px; height: 22px; margin: 16px 0; border-radius: 3px; background: var(--kat); border: 1.5px solid rgba(74,59,46,0.6); filter: none; }
    .bina-kart .ad {
      font-size: 12px; font-weight: bold; text-align: center; line-height: 1.05;
      max-width: 100%; overflow-wrap: anywhere; hyphens: auto;
    }
    .bina-kart .maliyet { font-size: 11px; white-space: nowrap; }
    .bina-kart .maliyet.yetmez { color: var(--kirmizi); font-weight: bold; }
    .bina-kart.kilitli { opacity: 0.5; filter: grayscale(0.7); cursor: not-allowed; }
    .bina-kart .kilit { font-size: 10px; color: var(--soluk); white-space: nowrap; }

    /* Yol fırçası etiketi */
    #fircaEtiket {
      position: absolute; padding: 3px 9px; font-size: 12px; white-space: nowrap;
      pointer-events: none !important; display: none; transform: rotate(-2deg); z-index: 4;
    }
    #fircaEtiket.kotu { color: var(--kirmizi); }
    #fircaEtiket.iyi { color: var(--yesil); font-weight: bold; }
    #fircaEtiket.soluk { color: var(--soluk); opacity: 0.85; }
    .bina-kart .tus { position: absolute; top: 3px; right: 6px; font-size: 10px; color: var(--soluk); }

    /* Tooltip */
    #ipucu {
      position: absolute; width: 220px; padding: 12px 14px; font-size: 12px; pointer-events: none !important;
      transform: rotate(-1deg); display: none; z-index: 5;
    }
    #ipucu h4 { margin: 0 0 4px; font-size: 14px; }
    #ipucu p { margin: 0 0 6px; }
    #ipucu table { border-collapse: collapse; width: 100%; }
    #ipucu td { padding: 1px 0; }
    #ipucu td:last-child { text-align: right; font-weight: bold; }

    /* Bilgi paneli */
    /* Öğretici: sağ altta kağıt not, oyunu durdurmaz */
    #ogretici { position: absolute; right: 18px; bottom: 110px; width: 260px; padding: 20px 16px 12px; transform: rotate(1.2deg); display: none; font-size: 13px; z-index: 5; }
    #ogretici .sayac { font-size: 11px; color: var(--soluk); }
    #ogretici h4 { margin: 2px 0 6px; font-size: 15px; }
    #ogretici p { margin: 0 0 10px; line-height: 1.4; }
    #ogretici .dugmeler { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
    #ogretici .dugme { width: auto; margin: 0; padding: 4px 12px; font-size: 12px; }
    #ogretici .dugme.ikincil { background: none; border: none; box-shadow: none; color: var(--soluk); text-decoration: underline; padding: 4px 0; }
    #ogretici.ilerledi { animation: vurgu 0.5s ease-out; }
    /* Ses aç/kapa (HUD) */
    #sesDugme { width: auto; margin: 0; padding: 4px 8px; font-size: 14px; }
    /* Karar kartı seçimi: oyun duraklar, üç kağıt kart */
    #kartSecim { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: rgba(60, 45, 30, 0.35); z-index: 8; }
    #kartSecim .baslik { padding: 18px 26px 12px; text-align: center; transform: rotate(-1deg); }
    #kartSecim .baslik h2 { margin: 0 0 4px; font-size: 20px; }
    #kartSecim .baslik p { margin: 0; font-size: 13px; color: var(--soluk); }
    #kartSecim .kartlar { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
    #kartSecim .kart { width: 190px; padding: 18px 16px 14px; border: none; text-align: left; transform: rotate(var(--egim, 0deg)); transition: transform 0.15s, box-shadow 0.15s; box-shadow: var(--golge-buyuk); }
    #kartSecim .kart:hover { transform: rotate(var(--egim, 0deg)) translateY(-8px) scale(1.04); }
    #kartSecim .kart .ikon { font-size: 30px; }
    #kartSecim .kart h3 { margin: 4px 0 10px; font-size: 16px; }
    #kartSecim .kart .arti { color: var(--yesil); font-size: 13px; margin-bottom: 6px; }
    #kartSecim .kart .eksi { color: var(--kirmizi); font-size: 13px; }
    #kartSecim .kart .sec { margin-top: 14px; text-align: center; font-size: 12px; color: var(--soluk); border-top: 1px dashed var(--soluk); padding-top: 6px; }
    /* Seçilmiş kartların simgeleri (HUD) */
    .hud-kartlar { display: flex; gap: 2px; font-size: 16px; cursor: default; }
    .hud-kartlar:empty { display: none; }
    /* Gezgin tüccar paneli */
    #tuccar { position: absolute; top: 120px; left: 50%; width: 330px; margin-left: -165px; padding: 26px 16px 14px; transform: rotate(-0.8deg); display: none; font-size: 12px; z-index: 6; }
    #tuccar h3 { margin: 0 0 2px; font-size: 17px; }
    #tuccar .alt { color: var(--soluk); margin-bottom: 6px; }
    #tuccar table { width: 100%; border-collapse: collapse; }
    #tuccar th { font-weight: normal; color: var(--soluk); text-align: left; font-size: 11px; }
    #tuccar td { padding: 2px 3px; }
    #tuccar td.fiyat { color: var(--soluk); white-space: nowrap; }
    #tuccar .dugme.kucuk { padding: 2px 7px; font-size: 12px; margin: 0; width: auto; }
    #tuccarDugme { display: none; width: auto; margin: 0; padding: 4px 9px; font-size: 13px; white-space: nowrap; }
    #bilgi { position: absolute; top: 120px; right: 18px; width: 230px; padding: 26px 16px 14px; transform: rotate(1.5deg); display: none; }
    #bilgi h3 { margin: 0 0 2px; font-size: 17px; }
    #bilgi .alt { font-size: 12px; color: var(--soluk); margin-bottom: 8px; }
    #bilgi table { border-collapse: collapse; width: 100%; font-size: 13px; }
    #bilgi td { padding: 2px 0; }
    #bilgi td:last-child { text-align: right; font-weight: bold; }
    #bilgi h4 { margin: 10px 0 4px; font-size: 13px; }
    #bilgi ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
    #bilgi li.ok { color: var(--yesil); }
    #bilgi li.yok { color: var(--kirmizi); }
    #bilgi li .ust { color: var(--soluk); font-size: 11px; }
    .dugme {
      margin-top: 12px; width: 100%; padding: 6px; border: 1.5px solid var(--murekkep);
      background: var(--kagit-koyu); border-radius: 4px; font-size: 13px; transition: transform 0.1s;
    }
    .dugme:hover { transform: rotate(-1deg) scale(1.03); }
    .dugme.tehlike { border-color: var(--kirmizi); color: var(--kirmizi); }
    .dugme:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .kapat { position: absolute; top: 4px; right: 8px; border: none; background: none; font-size: 16px; color: var(--soluk); }

    /* Oyun sonu */
    #sonEkran {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(74, 59, 46, 0.35);
    }
    #sonEkran .kagit { width: 300px; padding: 34px 26px 22px; transform: rotate(-1.5deg); text-align: center; box-shadow: var(--golge-buyuk); }
    #sonEkran h2 { margin: 0 0 12px; font-size: 24px; color: var(--kirmizi); }
    #sonEkran table { margin: 0 auto; font-size: 15px; }
    #sonEkran td { padding: 3px 8px; }
    #sonEkran td:last-child { font-weight: bold; text-align: right; }
  </style>
</head>
<body>
  <div id="sahne"></div>
  <div id="arayuz"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
